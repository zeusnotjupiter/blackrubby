name: Build and test wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish the already-built wheels to PyPI (requires license and trusted publisher setup)"
        required: true
        type: boolean
        default: false

jobs:
  wheels:
    name: ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade cibuildwheel
      - run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_* *-macosx_universal2"
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          # x86_64 wheels are cross-compiled on the arm64 runner; Rosetta is not
          # guaranteed on the runner image, so their tests are skipped.
          CIBW_TEST_SKIP: "*_macosx_x86_64"
          CIBW_TEST_REQUIRES: pytest numpy scikit-learn pandas
          CIBW_TEST_COMMAND: pytest {project}/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
